<!DOCTYPE html>
<html>
<head>
    <title>Longest Airport Route</title>
</head>
<body>

<h2>Longest Route</h2>

{% if longest %}

    <p>Route: {{ longest.path|join:" → " }}</p>
    <p>Total Duration: {{ longest.distance }} minutes</p>

{% else %}

    <p>{{ error }}</p>

{% endif %}

<a href="{% url 'add_route' %}">Back</a>

</body>
</html>
